<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MO Rijbewijs — Beheer</title><style>
:root{font-family:system-ui,Arial;color:#162747;background:#eef4fc}*{box-sizing:border-box}body{margin:0}header{background:#10254a;color:white;padding:20px}header div,main{max-width:1100px;margin:auto}header a{color:#bde9ff}main{padding:24px 16px}h1{margin:0 0 6px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:20px 0}.card{background:white;border:1px solid #dce5f1;border-radius:14px;padding:18px}.card strong{display:block;font-size:30px}table{width:100%;border-collapse:collapse;background:white}th,td{text-align:left;padding:12px;border-bottom:1px solid #e5ebf3}th{background:#e6effc}section{overflow-x:auto;border-radius:14px}button{padding:11px 16px;background:#1769ee;color:white;border:0;border-radius:9px;cursor:pointer}#status{margin:15px 0}small{color:#52657e}a{color:#1769ee}@media(max-width:600px){th,td{font-size:13px;padding:9px}}
</style><style id="mo-admin-premium">body{background:radial-gradient(circle at 5% 5%,#dceaff,transparent 40%),#f5f8ff;color:#172846}header{background:linear-gradient(110deg,#09172f,#163c7c);padding:30px 20px;box-shadow:0 12px 30px #0a24543b}header h1{letter-spacing:-.035em}main{max-width:1160px}.card{border-radius:20px;box-shadow:0 12px 35px #17375a12;border:1px solid #dce7f5;padding:24px}.card strong{color:#245bdc}section{box-shadow:0 12px 35px #17375a12;border:1px solid #dce7f5}th{background:#e9f1ff}td{background:#fff}button{background:linear-gradient(110deg,#3565f5,#128fe5);border-radius:12px;box-shadow:0 9px 20px #3265f532}button:hover{filter:brightness(1.08)}@media(max-width:600px){header{padding:22px 16px}.card{padding:18px}}</style></head><body><header><div><h1>🚙 MO Rijbewijs — Beheer</h1><a href="index.html">← Terug naar lessen</a></div></header><main><p>Alleen toegankelijk voor goedgekeurde beheerders.</p><div id="status" role="status">Beveiligde verbinding controleren…</div><div class="cards" id="stats" hidden></div><section id="users" hidden><table><thead><tr><th>E-mailadres</th><th>Account aangemaakt</th><th>Laatst ingelogd</th><th>Voortgang</th></tr></thead><tbody id="rows"></tbody></table></section><p><small>‘Laatst ingelogd’ is geen live online-status. Voortgang is gebaseerd op opgeslagen lesgegevens.</small></p><button id="refresh" hidden>Vernieuwen</button></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="config.js"></script><script>
const statusEl=document.getElementById('status'),rows=document.getElementById('rows'),stats=document.getElementById('stats');const cfg=window.MO_CONFIG;const date=v=>v?new Date(v).toLocaleString('nl-BE'):'Nog niet';
function cell(tr,value){const td=document.createElement('td');td.textContent=value;tr.appendChild(td)}
async function load(){try{if(!cfg?.supabaseUrl||!cfg?.supabaseKey||!window.supabase)throw Error('config.js of Supabase ontbreekt.');const client=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey);const {data:{user},error:ue}=await client.auth.getUser();if(ue||!user)throw Error('Log eerst in op de gewone website en open daarna deze pagina.');const {data:allowed,error:ae}=await client.rpc('mo_am_i_admin');if(ae)throw Error('Adminfunctie ontbreekt. Voer eerst admin_setup.sql uit in Supabase.');if(!allowed)throw Error('Geen beheerderstoegang. Controleer of je e-mailadres correct in de SQL is ingesteld.');const {data,error}=await client.rpc('mo_admin_overview');if(error)throw error;rows.replaceChildren();let total=0,withProgress=0;for(const u of data||[]){total++;const p=u.progress||{};if(Object.keys(p).length)withProgress++;const tr=document.createElement('tr');cell(tr,u.email||'(geen e-mail)');cell(tr,date(u.created_at));cell(tr,date(u.last_sign_in_at));cell(tr,Object.keys(p).length?'Voortgang opgeslagen':'Nog geen voortgang');rows.appendChild(tr)}stats.replaceChildren();for(const [label,value] of [['Geregistreerde accounts',total],['Met opgeslagen voortgang',withProgress]]){const div=document.createElement('div');div.className='card';div.textContent=label;const strong=document.createElement('strong');strong.textContent=value;div.appendChild(strong);stats.appendChild(div)}stats.hidden=false;document.getElementById('users').hidden=false;document.getElementById('refresh').hidden=false;statusEl.textContent='Gegevens geladen.'}catch(e){statusEl.textContent=e.message;stats.hidden=true;document.getElementById('users').hidden=true}}
document.getElementById('refresh').onclick=load;load();
</script></body></html>
